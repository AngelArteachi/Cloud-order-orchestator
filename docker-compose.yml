services:
  postgres:
    image: postgres:16-alpine
    container_name: orchestrator_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-auth_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orchestrator_net

  mongodb:
    image: mongo:7.0
    container_name: orchestrator_mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mongo_secret}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orchestrator_net

  redis:
    image: redis:7-alpine
    container_name: orchestrator_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orchestrator_net

  user-auth-service:
    build:
      context: .
      dockerfile: services/user-auth-service/Dockerfile
    container_name: orchestrator_user_auth_service
    restart: always
    ports:
      - "${USER_AUTH_SERVICE_PORT:-3001}:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secret}@postgres:5432/${POSTGRES_DB:-auth_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production_32chars}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orchestrator_net

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: orchestrator_order_service
    restart: always
    ports:
      - "${ORDER_SERVICE_PORT:-3002}:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-mongo_secret}@mongodb:27017/${MONGO_DB:-orders_db}?authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_change_in_production_32chars}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-super_secret_webhook_signing_key_32chars}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - orchestrator_net

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: orchestrator_notification_service
    restart: always
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-3003}:3003"
    environment:
      NODE_ENV: development
      PORT: 3003
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - orchestrator_net

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: orchestrator_payment_service
    restart: always
    ports:
      - "${PAYMENT_SERVICE_PORT:-3004}:3004"
    environment:
      NODE_ENV: development
      PORT: 3004
      ORDER_SERVICE_URL: http://order-service:3002
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-super_secret_webhook_signing_key_32chars}
    networks:
      - orchestrator_net

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: orchestrator_api_gateway
    restart: always
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://user-auth-service:3001
      ORDER_SERVICE_URL: http://order-service:3002
      NOTIFICATION_SERVICE_URL: http://notification-service:3003
      PAYMENT_SERVICE_URL: http://payment-service:3004
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
    depends_on:
      - user-auth-service
      - order-service
      - notification-service
      - payment-service
      - redis
    networks:
      - orchestrator_net

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  orchestrator_net:
    driver: bridge
